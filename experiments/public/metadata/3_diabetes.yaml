# 3_diabetes — Pima Indians Diabetes, OpenML 37; analysis file written by experiments/public/fetch_data.py.
# Used by main.py --metadata. Predictors not listed under `categorical` are continuous.

# column: allowed codes (generated values are snapped to these)
categorical: {}

# Tuned on the full cohort with Optuna; `tuning` is a record of the search (n_iter = training-step budget from which
# `epochs` was derived) and is not read by the code. A generator without an entry uses grid.config.DEEP_GENERATOR_DEFAULTS.
generators:
  ctgan:
    params:
      batch_size: 100
      embedding_dim: 16
      discriminator_steps: 2
      epochs: 250
      generator_dim: [256]
      discriminator_dim: [256]
      generator_lr: 0.0007560397368844555
      discriminator_lr: 0.0007560397368844555
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 1000, objective: 0.8162382948986724, n_trials: 30, n_complete: 30}
  tvae:
    params:
      batch_size: 100
      embedding_dim: 128
      loss_factor: 1.4886489606631013
      epochs: 400
      compress_dims: [256, 256, 256]
      decompress_dims: [256, 256, 256]
    tuning: {n_iter: 2000, objective: 0.8175655485674354, n_trials: 30, n_complete: 30}
  copulagan:
    params:
      batch_size: 100
      embedding_dim: 64
      discriminator_steps: 2
      epochs: 500
      generator_dim: [128, 128]
      discriminator_dim: [128, 128]
      generator_lr: 0.000393465456967481
      discriminator_lr: 0.000393465456967481
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 2000, objective: 0.8163770789657582, n_trials: 30, n_complete: 30}
