# 6_ilpd — Indian Liver Patient Dataset, UCI 225; analysis file written by experiments/public/fetch_data.py.
# Used by main.py --metadata. Predictors not listed under `categorical` are continuous.

# column: allowed codes (generated values are snapped to these)
categorical:
  Gender: [0, 1]

# Tuned on the full cohort with Optuna; `tuning` is a record of the search (n_iter = training-step budget from which
# `epochs` was derived) and is not read by the code. A generator without an entry uses grid.config.DEEP_GENERATOR_DEFAULTS.
generators:
  ctgan:
    params:
      batch_size: 100
      embedding_dim: 128
      discriminator_steps: 1
      epochs: 667
      generator_dim: [128]
      discriminator_dim: [128]
      generator_lr: 0.00040624696868638753
      discriminator_lr: 0.00040624696868638753
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 2000, objective: 0.7203693710540611, n_trials: 30, n_complete: 30}
  tvae:
    params:
      batch_size: 50
      embedding_dim: 16
      loss_factor: 2.659909926694868
      epochs: 62
      compress_dims: [64, 64]
      decompress_dims: [64, 64]
    tuning: {n_iter: 500, objective: 0.7293444287126333, n_trials: 30, n_complete: 30}
  copulagan:
    params:
      batch_size: 100
      embedding_dim: 128
      discriminator_steps: 1
      epochs: 667
      generator_dim: [128, 128, 128]
      discriminator_dim: [128, 128, 128]
      generator_lr: 0.0001079939097376841
      discriminator_lr: 0.0001079939097376841
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 2000, objective: 0.7141239013704486, n_trials: 30, n_complete: 30}
