# 2_breast_cancer_wdbc — Breast Cancer Wisconsin (Diagnostic), UCI 17; analysis file written by experiments/public/fetch_data.py.
# Used by main.py --metadata. Predictors not listed under `categorical` are continuous.

# column: allowed codes (generated values are snapped to these)
categorical: {}

# Tuned on the full cohort with Optuna; `tuning` is a record of the search (n_iter = training-step budget from which
# `epochs` was derived) and is not read by the code. A generator without an entry uses grid.config.DEEP_GENERATOR_DEFAULTS.
generators:
  ctgan:
    params:
      batch_size: 50
      embedding_dim: 64
      discriminator_steps: 2
      epochs: 71
      generator_dim: [32]
      discriminator_dim: [32]
      generator_lr: 0.0001896845544990888
      discriminator_lr: 0.0001896845544990888
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 500, objective: 0.9920089811045427, n_trials: 30, n_complete: 30}
  tvae:
    params:
      batch_size: 50
      embedding_dim: 16
      loss_factor: 9.301146392021687
      epochs: 62
      compress_dims: [256]
      decompress_dims: [256]
    tuning: {n_iter: 500, objective: 0.9931949145345805, n_trials: 30, n_complete: 30}
  copulagan:
    params:
      batch_size: 20
      embedding_dim: 64
      discriminator_steps: 1
      epochs: 28
      generator_dim: [64]
      discriminator_dim: [64]
      generator_lr: 0.00040313717805118716
      discriminator_lr: 0.00040313717805118716
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 500, objective: 0.9919954481410427, n_trials: 30, n_complete: 30}
