# 8_thoracic_surgery — Thoracic Surgery Data, UCI 277; analysis file written by experiments/public/fetch_data.py.
# Used by main.py --metadata. Predictors not listed under `categorical` are continuous.

# column: allowed codes (generated values are snapped to these)
categorical:
  DGN: [0, 1, 2, 3, 4, 5, 6]
  PRE6: [0, 1, 2]
  PRE7: [0, 1]
  PRE8: [0, 1]
  PRE9: [0, 1]
  PRE10: [0, 1]
  PRE11: [0, 1]
  PRE14: [0, 1, 2, 3]
  PRE17: [0, 1]
  PRE19: [0, 1]
  PRE25: [0, 1]
  PRE30: [0, 1]
  PRE32: [0, 1]

# Tuned on the full cohort with Optuna; `tuning` is a record of the search (n_iter = training-step budget from which
# `epochs` was derived) and is not read by the code. A generator without an entry uses grid.config.DEEP_GENERATOR_DEFAULTS.
generators:
  ctgan:
    params:
      batch_size: 50
      embedding_dim: 128
      discriminator_steps: 2
      epochs: 333
      generator_dim: [32]
      discriminator_dim: [32]
      generator_lr: 0.00013273190536830742
      discriminator_lr: 0.00013273190536830742
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 2000, objective: 0.6260892857142857, n_trials: 30, n_complete: 30}
  tvae:
    params:
      batch_size: 50
      embedding_dim: 16
      loss_factor: 3.891137770650005
      epochs: 333
      compress_dims: [256, 256]
      decompress_dims: [256, 256]
    tuning: {n_iter: 2000, objective: 0.6210357142857142, n_trials: 30, n_complete: 30}
  copulagan:
    params:
      batch_size: 20
      embedding_dim: 32
      discriminator_steps: 2
      epochs: 33
      generator_dim: [32]
      discriminator_dim: [32]
      generator_lr: 0.0006569194874590628
      discriminator_lr: 0.0006569194874590628
      generator_decay: 1.0e-06
      discriminator_decay: 1.0e-06
      pac: 10
    tuning: {n_iter: 500, objective: 0.6253392857142858, n_trials: 30, n_complete: 30}
